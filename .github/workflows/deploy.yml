name: Deploy to PlanetHoster

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Style (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo, pdo_mysql, sqlite, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install All Composer Dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Run PHP Code Style Check
        run: ./vendor/bin/pint --test

  test:
    name: Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo, pdo_mysql, sqlite, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install All Composer Dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Copy Environment File & Generate Key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Automated Tests
        run: php artisan test

  build:
    name: Build Dependencies & Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo, pdo_mysql, sqlite, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Production Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-progress --no-interaction --prefer-dist

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Prepare Deployment Artifact
        run: |
          mkdir deploy_artifact
          rsync -av --progress ./ deploy_artifact/ --exclude .git --exclude .github --exclude node_modules --exclude tests --exclude deploy_artifact
          tar -czf deploy_artifact.tar.gz -C deploy_artifact .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifact
          path: deploy_artifact.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to Server
    needs: [lint, test, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-artifact

      - name: Decompress Artifact
        run: |
          mkdir deploy_artifact
          tar -xzf deploy_artifact.tar.gz -C deploy_artifact

      - name: Sync Files to Server
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "deploy_artifact/"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
          EXCLUDE: "/storage, /.env"

      - name: Run Remote Post-Deployment Commands
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # Ensure all required Laravel directories exist
            mkdir -p storage/framework/cache/data
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/logs
            mkdir -p bootstrap/cache

            # Set proper permissions
            chmod -R 775 storage bootstrap/cache

            # Link storage if not already linked (idempotent-ish)
            php artisan storage:link || true

            # Upload assets to N0C storage CDN
            php artisan storage:upload-assets --force

            # Database migrations
            php artisan migrate --force

            # Database Seeding
            # seeders are configured to only run specific seeders in production
            php artisan db:seed --force

            # Clear stale caches before re-optimizing
            # This ensures sitemap cache (sitemap:blogs) and config cache
            # are always regenerated fresh after each deploy
            php artisan cache:clear
            php artisan config:clear
            php artisan view:clear

            # Optimization commands (re-cache config, routes, views)
            php artisan optimize
            php artisan view:cache

            # Restart queue workers so they load the new code
            php artisan queue:restart

            echo "Deployment complete!"
